name: MemBrowse PR Comment

on:
  workflow_run:
    # Must match the `name:` of membrowse-report.yml
    workflows: [MemBrowse Memory Report]
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    # Run even if some builds failed, but skip cancelled and skipped runs
    # (nothing was uploaded, so the summary lookup would 404).
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Post combined PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        uses: membrowse/membrowse-action/comment-action@v1
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
